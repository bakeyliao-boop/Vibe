<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eee9dd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10120f" media="(prefers-color-scheme: dark)">
  <title>Vibe · 共同内容池 Mock</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #eee9dd; }
    body { min-height: 100vh; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #10120f; }
    }
  </style>
</head>
<body>
<div id="pinned-source-orbit" aria-label="地点、类型和分享人三种视角下始终可打开原内容的共同内容池">
  <style>
    #pinned-source-orbit {
      color-scheme: light dark;
      width: 100%;
      min-height: 920px;
      display: grid;
      place-items: start center;
      padding: 18px 0 24px;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #pinned-source-orbit * { box-sizing: border-box; }
    #pinned-source-orbit .pso-phone {
      position: relative;
      width: min(393px, calc(100vw - 28px));
      height: 872px;
      overflow: hidden;
      border-radius: 49px;
      isolation: isolate;
      color: light-dark(#28261f, #f5efe2);
      background:
        radial-gradient(circle at 74% 6%, light-dark(rgba(223,178,105,.24), rgba(226,157,60,.11)), transparent 29%),
        radial-gradient(circle at 7% 71%, light-dark(rgba(74,133,122,.17), rgba(58,137,119,.11)), transparent 31%),
        light-dark(#eee9dd, #10120f);
      border: 1px solid light-dark(rgba(57,47,31,.16), rgba(255,238,199,.11));
      box-shadow: 0 31px 90px light-dark(rgba(49,37,17,.22), rgba(0,0,0,.59));
    }
    #pinned-source-orbit .pso-phone::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 90;
      pointer-events: none;
      border-radius: inherit;
      box-shadow: inset 0 0 0 7px light-dark(rgba(255,255,255,.42), rgba(255,255,255,.026));
    }
    #pinned-source-orbit .pso-status {
      position: relative;
      z-index: 50;
      height: 31px;
      padding: 12px 27px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 11px;
      font-weight: 500;
    }
    #pinned-source-orbit .pso-status-icons { display: flex; align-items: center; gap: 5px; }
    #pinned-source-orbit .pso-signal { width: 13px; height: 8px; border-left: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: skew(-16deg); opacity: .82; }
    #pinned-source-orbit .pso-wifi { width: 11px; height: 8px; border: 2px solid currentColor; border-color: currentColor transparent transparent; border-radius: 50%; opacity: .82; }
    #pinned-source-orbit .pso-battery { width: 18px; height: 8px; border: 1.5px solid currentColor; border-radius: 2px; position: relative; opacity: .82; }
    #pinned-source-orbit .pso-battery::before { content: ""; position: absolute; inset: 1.5px 3px 1.5px 1.5px; border-radius: 1px; background: currentColor; }
    #pinned-source-orbit .pso-battery::after { content: ""; position: absolute; right: -3px; top: 2px; width: 2px; height: 3px; background: currentColor; border-radius: 0 1px 1px 0; }

    #pinned-source-orbit .pso-header {
      position: relative;
      z-index: 48;
      height: 68px;
      padding: 10px 22px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #pinned-source-orbit .pso-kicker { font-size: 11px; letter-spacing: 1px; opacity: .52; font-weight: 500; }
    #pinned-source-orbit .pso-title { margin-top: 3px; font-family: ui-serif, "Songti SC", serif; font-size: 28px; line-height: 1; letter-spacing: -.65px; font-weight: 500; }
    #pinned-source-orbit .pso-count { text-align: right; font-size: 11px; line-height: 1.45; opacity: .53; }

    #pinned-source-orbit .pso-segments {
      position: relative;
      z-index: 48;
      height: 51px;
      margin: 0 17px 7px;
      padding: 5px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      border-radius: 20px;
      border: 1px solid light-dark(rgba(73,56,35,.12), rgba(255,226,174,.09));
      background: light-dark(rgba(255,252,243,.60), rgba(31,31,25,.68));
      backdrop-filter: blur(15px) saturate(1.05);
    }
    #pinned-source-orbit .pso-segments button {
      border: 0;
      border-radius: 16px;
      padding: 0;
      cursor: pointer;
      color: inherit;
      background: transparent;
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      opacity: .47;
      transition: opacity .23s ease, background .28s ease, transform .28s ease;
    }
    #pinned-source-orbit .pso-segments button[aria-pressed="true"] {
      opacity: 1;
      transform: translateY(-1px);
      background: light-dark(rgba(255,249,235,.94), rgba(72,58,37,.90));
      box-shadow: 0 7px 17px light-dark(rgba(77,49,14,.11), rgba(0,0,0,.28));
    }

    #pinned-source-orbit .pso-world {
      position: relative;
      height: 692px;
      margin: 0 12px;
      overflow: hidden;
      border-radius: 32px;
      border: 1px solid light-dark(rgba(66,53,34,.09), rgba(255,232,183,.06));
      background:
        radial-gradient(ellipse at 50% 28%, light-dark(rgba(255,255,255,.45), rgba(255,255,255,.025)), transparent 67%),
        light-dark(rgba(249,246,236,.32), rgba(14,16,13,.50));
    }
    #pinned-source-orbit .pso-grain {
      position: absolute;
      inset: 0;
      z-index: 0;
      opacity: .23;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(174deg, transparent 0 31px, light-dark(rgba(76,60,38,.06), rgba(242,207,143,.05)) 32px, transparent 33px 62px),
        radial-gradient(circle at 9% 19%, light-dark(rgba(45,38,29,.1), rgba(255,255,255,.055)) 0 1px, transparent 1.3px);
      background-size: auto, 18px 17px;
    }

    #pinned-source-orbit .pso-group-head {
      position: absolute;
      z-index: 36;
      left: 17px;
      right: 17px;
      top: 15px;
      display: grid;
      grid-template-columns: minmax(0,1fr) 130px;
      gap: 8px;
      align-items: start;
      pointer-events: none;
    }
    #pinned-source-orbit .pso-group-name { font-family: ui-serif, "Songti SC", serif; font-size: 18px; line-height: 1.2; font-weight: 500; }
    #pinned-source-orbit .pso-group-fact { text-align: right; font-size: 11px; line-height: 1.42; opacity: .52; }

    #pinned-source-orbit .pso-deck {
      position: absolute;
      z-index: 6;
      left: 0;
      right: 0;
      top: 58px;
      height: 350px;
      overflow: hidden;
    }
    #pinned-source-orbit .pso-halo {
      position: absolute;
      z-index: 0;
      left: 14%;
      top: 4%;
      width: 72%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid light-dark(rgba(151,100,41,.20), rgba(232,171,77,.16));
      box-shadow:
        inset 0 0 0 16px light-dark(rgba(171,114,46,.03), rgba(196,126,43,.035)),
        inset 0 0 0 37px light-dark(rgba(171,114,46,.022), rgba(196,126,43,.023));
      pointer-events: none;
    }
    #pinned-source-orbit .pso-sleeve {
      position: absolute;
      z-index: 1;
      top: 70px;
      width: 30px;
      height: 180px;
      opacity: .38;
      border: 1px solid light-dark(rgba(88,66,39,.15), rgba(244,207,140,.11));
      background: light-dark(rgba(223,201,158,.45), rgba(70,55,34,.55));
      box-shadow: 0 10px 20px rgba(0,0,0,.14);
      pointer-events: none;
    }
    #pinned-source-orbit .pso-sleeve-left { left: -12px; border-radius: 0 18px 18px 0; }
    #pinned-source-orbit .pso-sleeve-right { right: -12px; border-radius: 18px 0 0 18px; }

    #pinned-source-orbit .pso-specimen {
      appearance: none;
      position: absolute;
      z-index: 7;
      margin: 0;
      padding: 0;
      border: 0;
      cursor: pointer;
      color: inherit;
      background: transparent;
      text-align: left;
      transition:
        left .48s cubic-bezier(.18,.82,.22,1),
        top .48s cubic-bezier(.18,.82,.22,1),
        width .48s cubic-bezier(.18,.82,.22,1),
        opacity .32s ease,
        filter .32s ease,
        transform .48s cubic-bezier(.18,.82,.22,1);
      -webkit-tap-highlight-color: transparent;
    }
    #pinned-source-orbit .pso-specimen:focus-visible { outline: 2px solid light-dark(#97672c,#efb85a); outline-offset: 3px; border-radius: 17px; }
    #pinned-source-orbit .pso-slide {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: .84;
      overflow: hidden;
      border-radius: 18px 11px 20px 12px;
      border: 1px solid light-dark(rgba(80,61,37,.18), rgba(255,227,174,.15));
      background: light-dark(rgba(234,219,189,.82), rgba(63,53,37,.86));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 10px 21px light-dark(rgba(65,44,16,.16), rgba(0,0,0,.34));
      backdrop-filter: blur(5px) saturate(1.05);
    }
    #pinned-source-orbit .pso-cover { width: 100%; height: 100%; display: block; object-fit: cover; filter: saturate(.9) contrast(.99); }
    #pinned-source-orbit .pso-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      padding: 10px 8px;
      color: #fff8e8;
      background: radial-gradient(circle at 75% 20%, rgba(255,255,255,.27), transparent 22%), linear-gradient(148deg,#53736b,#bd945b 55%,#71483a);
    }
    #pinned-source-orbit .pso-fallback strong { font-family: ui-serif, "Songti SC", serif; font-size: 12px; line-height: 1.2; font-weight: 500; }
    #pinned-source-orbit .pso-index {
      position: absolute;
      z-index: 4;
      left: 6px;
      bottom: 6px;
      min-width: 21px;
      height: 21px;
      padding: 0 5px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      color: #fff7e4;
      background: rgba(17,18,15,.63);
      backdrop-filter: blur(7px);
      font-size: 11px;
      font-weight: 500;
    }
    #pinned-source-orbit .pso-item-name {
      display: block;
      max-width: 150px;
      margin-top: 6px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 11px;
      line-height: 1.3;
      opacity: .72;
      text-shadow: 0 1px light-dark(rgba(255,255,255,.72),rgba(0,0,0,.5));
    }
    #pinned-source-orbit .pso-specimen.is-hidden { opacity: .10; filter: grayscale(.5) saturate(.35); pointer-events: none; }
    #pinned-source-orbit .pso-specimen.is-active { z-index: 20; opacity: 1; filter: none; }
    #pinned-source-orbit .pso-specimen.is-selected {
      z-index: 29;
      transform: translateY(-9px) scale(1.035) !important;
      filter: drop-shadow(0 12px 15px light-dark(rgba(169,101,28,.27),rgba(239,157,57,.18)));
    }
    #pinned-source-orbit .pso-specimen.is-selected .pso-slide { border-color: light-dark(rgba(154,102,36,.54),rgba(244,181,83,.48)); box-shadow: inset 0 1px rgba(255,255,255,.45),0 13px 25px rgba(0,0,0,.24); }
    #pinned-source-orbit .pso-reply {
      position: absolute;
      z-index: 12;
      left: 79%;
      top: 67%;
      width: 91px;
      min-height: 30px;
      display: none;
      align-items: center;
      padding: 6px 9px;
      border-radius: 5px 14px 14px 5px;
      color: light-dark(#5c4328,#f1cb89);
      background: light-dark(rgba(251,239,215,.95),rgba(59,47,29,.96));
      border: 1px solid light-dark(rgba(111,77,36,.16),rgba(242,195,112,.16));
      box-shadow: 0 8px 17px rgba(0,0,0,.15);
      font-size: 11px;
      line-height: 1.25;
      transform: rotate(2deg);
    }
    #pinned-source-orbit .pso-specimen[data-id="11"].is-active .pso-reply { display: flex; }

    #pinned-source-orbit .pso-strip-wrap {
      position: absolute;
      z-index: 37;
      left: 14px;
      right: 14px;
      top: 419px;
      height: 72px;
    }
    #pinned-source-orbit .pso-strip-label { height: 20px; font-size: 11px; line-height: 1.35; opacity: .48; }
    #pinned-source-orbit .pso-strip {
      position: relative;
      height: 50px;
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px 41%;
      border-radius: 17px;
      border: 1px solid light-dark(rgba(82,62,37,.13),rgba(244,207,140,.11));
      background:
        linear-gradient(90deg, transparent 49.7%, light-dark(rgba(119,82,38,.45),rgba(232,170,76,.44)) 49.7% 50.3%, transparent 50.3%),
        light-dark(rgba(252,246,234,.78),rgba(43,38,29,.80));
      backdrop-filter: blur(13px);
      scroll-snap-type: x mandatory;
    }
    #pinned-source-orbit .pso-strip::-webkit-scrollbar { display: none; }
    #pinned-source-orbit .pso-strip button {
      flex: 0 0 auto;
      min-width: 86px;
      height: 39px;
      scroll-snap-align: center;
      border: 0;
      border-radius: 13px;
      padding: 0 10px;
      cursor: pointer;
      color: inherit;
      background: transparent;
      font: inherit;
      font-size: 11px;
      line-height: 1.25;
      opacity: .39;
      white-space: nowrap;
      transition: opacity .22s ease, background .25s ease, transform .25s ease;
    }
    #pinned-source-orbit .pso-strip button[aria-pressed="true"] {
      opacity: 1;
      transform: translateY(-1px);
      background: light-dark(rgba(255,250,238,.94),rgba(75,59,36,.91));
      box-shadow: 0 6px 13px rgba(0,0,0,.13);
    }

    #pinned-source-orbit .pso-source-dock {
      position: absolute;
      z-index: 43;
      left: 14px;
      right: 14px;
      bottom: 14px;
      height: 177px;
      padding: 12px;
      border-radius: 15px 23px 20px 17px;
      border: 1px solid light-dark(rgba(77,59,36,.13),rgba(246,209,143,.11));
      color: inherit;
      background: light-dark(rgba(255,250,239,.91),rgba(35,33,26,.94));
      box-shadow: 0 13px 28px light-dark(rgba(65,43,15,.14),rgba(0,0,0,.36));
      backdrop-filter: blur(18px) saturate(1.08);
      transition: height .28s ease;
    }
    #pinned-source-orbit .pso-dock-top { display: grid; grid-template-columns: 48px minmax(0,1fr); gap: 10px; align-items: center; min-height: 49px; }
    #pinned-source-orbit .pso-dock-thumb { width: 48px; height: 48px; overflow: hidden; border-radius: 12px 7px 13px 8px; background: light-dark(#d7c29b,#4f422e); border: 1px solid light-dark(rgba(80,61,37,.14),rgba(248,213,149,.11)); }
    #pinned-source-orbit .pso-dock-thumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
    #pinned-source-orbit .pso-dock-thumb span { width: 100%; height: 100%; display: grid; place-items: center; padding: 5px; color: #fff8e8; text-align: center; font-family: ui-serif,"Songti SC",serif; font-size: 11px; line-height: 1.15; background: linear-gradient(148deg,#53736b,#bd945b 55%,#71483a); }
    #pinned-source-orbit .pso-dock-title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-family: ui-serif,"Songti SC",serif; font-size: 16px; line-height: 1.25; font-weight: 500; }
    #pinned-source-orbit .pso-dock-meta { margin-top: 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11px; opacity: .55; }
    #pinned-source-orbit .pso-dock-context { height: 27px; padding-top: 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11px; opacity: .61; }
    #pinned-source-orbit .pso-open-link {
      width: 100%;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 17px;
      color: light-dark(#fff9ec,#1e1912);
      background: light-dark(#6f4b25,#e2b567);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 9px 18px light-dark(rgba(103,65,21,.21),rgba(0,0,0,.29));
    }
    #pinned-source-orbit .pso-link-state { margin-top: 7px; text-align: center; font-size: 11px; opacity: .48; }
    #pinned-source-orbit .pso-first-hint {
      position: absolute;
      z-index: 60;
      left: 50%;
      top: 354px;
      transform: translateX(-50%);
      padding: 7px 10px;
      border-radius: 12px;
      white-space: nowrap;
      color: light-dark(#523c23,#efd096);
      background: light-dark(rgba(255,248,232,.89),rgba(43,37,26,.91));
      border: 1px solid light-dark(rgba(98,69,34,.12),rgba(243,198,119,.12));
      box-shadow: 0 8px 17px rgba(0,0,0,.13);
      backdrop-filter: blur(12px);
      font-size: 11px;
      opacity: 1;
      transition: opacity .3s ease, transform .3s ease;
      pointer-events: none;
    }
    #pinned-source-orbit .pso-first-hint.is-gone { opacity: 0; transform: translate(-50%,5px); }

    @media (max-width: 390px) {
      #pinned-source-orbit { min-height: 865px; padding-top: 8px; }
      #pinned-source-orbit .pso-phone { height: 832px; border-radius: 43px; }
      #pinned-source-orbit .pso-world { height: 652px; }
      #pinned-source-orbit .pso-deck { height: 318px; }
      #pinned-source-orbit .pso-strip-wrap { top: 382px; }
      #pinned-source-orbit .pso-source-dock { height: 174px; }
      #pinned-source-orbit .pso-first-hint { top: 321px; }
      #pinned-source-orbit .pso-group-head { grid-template-columns: minmax(0,1fr) 112px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #pinned-source-orbit *, #pinned-source-orbit *::before, #pinned-source-orbit *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>

  <section class="pso-phone" aria-label="iPhone共同内容池">
    <div class="pso-status"><span>9:41</span><span class="pso-status-icons"><i class="pso-signal"></i><i class="pso-wifi"></i><i class="pso-battery"></i></span></div>
    <header class="pso-header">
      <div><div class="pso-kicker">OUR INTERNET · 共同池</div><div class="pso-title">围着一条内容看</div></div>
      <div class="pso-count">13枚标本<br>来源 · 小红书</div>
    </header>
    <nav class="pso-segments" aria-label="切换内容视角">
      <button type="button" data-mode="place" aria-pressed="true">地点</button>
      <button type="button" data-mode="type" aria-pressed="false">类型</button>
      <button type="button" data-mode="person" aria-pressed="false">分享人</button>
    </nav>

    <main class="pso-world">
      <div class="pso-grain"></div>
      <div class="pso-group-head">
        <div class="pso-group-name">金华 · 3条</div>
        <div class="pso-group-fact">三个标题都出现“金华”</div>
      </div>
      <section class="pso-deck" aria-label="当前关系组中的内容标本">
        <div class="pso-halo"></div>
        <div class="pso-sleeve pso-sleeve-left"></div>
        <div class="pso-sleeve pso-sleeve-right"></div>
        <div class="pso-items"></div>
      </section>

      <section class="pso-strip-wrap" aria-label="横滑切换关系组">
        <div class="pso-strip-label">左右滑或点组名；选中的内容不会丢</div>
        <div class="pso-strip"></div>
      </section>

      <section class="pso-source-dock" aria-label="选中资源与原内容入口">
        <div class="pso-dock-top">
          <div class="pso-dock-thumb"></div>
          <div><div class="pso-dock-title"></div><div class="pso-dock-meta"></div></div>
        </div>
        <div class="pso-dock-context"></div>
        <a class="pso-open-link" href="#" target="_blank" rel="noopener noreferrer">打开原内容 <span aria-hidden="true">↗</span></a>
        <div class="pso-link-state">可达性尚未验证 · 仍可尝试打开</div>
      </section>
      <div class="pso-first-hint">点一张封面，随时回到原平台</div>
    </main>
  </section>

  <script>
    (() => {
      const root = document.getElementById("pinned-source-orbit");
      const modeButtons = Array.from(root.querySelectorAll("[data-mode]"));
      const itemsRoot = root.querySelector(".pso-items");
      const strip = root.querySelector(".pso-strip");
      const groupName = root.querySelector(".pso-group-name");
      const groupFact = root.querySelector(".pso-group-fact");
      const dockThumb = root.querySelector(".pso-dock-thumb");
      const dockTitle = root.querySelector(".pso-dock-title");
      const dockMeta = root.querySelector(".pso-dock-meta");
      const dockContext = root.querySelector(".pso-dock-context");
      const openLink = root.querySelector(".pso-open-link");

          {key:"place",label:"地点线索",ids:[1,2,4,6,7,8,9,10,13],fact:"标题或分享文案出现地点原词"},
          {key:"browse",label:"逛看现场",ids:[3,4,7],fact:"原题出现市场、水族馆或「逛」"},
          {key:"action",label:"动手体验",ids:[8,11],fact:"原题出现「潜水」或「去做」"},
          {key:"object",label:"单体对象",ids:[5],fact:"当前只确认到「一朵百合」"},
          {key:"unknown",label:"类型未知",ids:[12,13],fact:"不为了完整而强行归类"}
        ],
        person:[
          {key:"weiyan",label:"未延",ids:[1,3,4,5,6,7,8,9],fact:"8条由未延带进共同池"},
          {key:"aoliao",label:"奥里里奥",ids:[2,11],fact:"2条由奥里里奥带进共同池"},
          {key:"you",label:"你",ids:[10],fact:"1条由你带进共同池"},
          {key:"missing",label:"出处缺失",ids:[12,13],fact:"2条没有分享者与群聊时间"}
        ]
      };
      const fanSlots = {
        1:[{x:29,y:28,w:42,r:0}],
        2:[{x:12,y:56,w:38,r:-6},{x:51,y:56,w:38,r:6}],
        3:[{x:4,y:83,w:35,r:-6},{x:32,y:27,w:37,r:0},{x:62,y:83,w:34,r:6}],
        4:[{x:2,y:62,w:30,r:-7},{x:23,y:25,w:31,r:-2},{x:48,y:25,w:31,r:2},{x:70,y:62,w:29,r:7}],
        many:[
          {x:3,y:25,w:23,r:-4},{x:27,y:16,w:23,r:-1},{x:51,y:16,w:23,r:1},{x:75,y:25,w:22,r:4},
          {x:4,y:176,w:23,r:-3},{x:28,y:164,w:23,r:0},{x:52,y:164,w:23,r:0},{x:76,y:176,w:22,r:3},
          {x:17,y:267,w:21,r:-2}
        ]
      };
      const hiddenSlots = [
        {x:-7,y:65,w:18,r:-5},{x:89,y:65,w:18,r:5},{x:-5,y:210,w:17,r:-4},{x:89,y:210,w:17,r:4},
        {x:7,y:278,w:16,r:-3},{x:77,y:278,w:16,r:3},{x:24,y:294,w:15,r:-2},{x:61,y:294,w:15,r:2}
      ];

      let mode = "place";
      let activeIndex = {place:0,type:0,person:0};
      let selectedId = 8;
      let hintShown = true;

      function makeCover(item,className) {
        if (item.cover) {
          const image = document.createElement("img");
          image.className = className;
          image.src = item.cover;
          image.alt = item.title + "的分享封面";
          return image;
        }
        const fallback = document.createElement("span");
        fallback.className = "pso-fallback";
        const title = document.createElement("strong");
        title.textContent = item.short;
        fallback.append(title);
        return fallback;
      }
      items.forEach((item) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "pso-specimen";
        button.dataset.id = String(item.id);
        button.setAttribute("aria-label",item.title + "，选中后可打开原内容");
        const slide = document.createElement("span");
        slide.className = "pso-slide";
        slide.append(makeCover(item,"pso-cover"));
        const index = document.createElement("span");
        index.className = "pso-index";
        index.textContent = String(item.id).padStart(2,"0");
        slide.append(index);
        if (item.reply) {
          const reply = document.createElement("span");
          reply.className = "pso-reply";
          reply.textContent = item.reply;
          slide.append(reply);
        }
        const name = document.createElement("span");
        name.className = "pso-item-name";
        name.textContent = item.short;
        button.append(slide,name);
        button.addEventListener("click",() => selectItem(item.id));
        itemsRoot.append(button);
        itemButtons.set(item.id,button);
      });

      function setPosition(button,slot) {
        button.style.left = slot.x + "%";
        button.style.top = slot.y + "px";
        button.style.width = slot.w + "%";
        button.style.transform = "rotate(" + slot.r + "deg)";
      }
      function currentGroup() { return groups[mode][activeIndex[mode]]; }
      function groupContaining(id,targetMode) {
        return groups[targetMode].findIndex((group) => group.ids.includes(id));
      }
      function renderStrip() {
        strip.replaceChildren();
        groups[mode].forEach((group,index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.dataset.groupIndex = String(index);
          button.setAttribute("aria-pressed",String(index === activeIndex[mode]));
          button.textContent = group.label + " · " + group.ids.length;
          button.addEventListener("click",() => {
            activeIndex[mode] = index;
            render();
            requestAnimationFrame(() => button.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"}));
          });
          strip.append(button);
        });
      }
      function renderDeck() {
        const group = currentGroup();
        groupName.textContent = group.label + " · " + group.ids.length + "条";
        groupFact.textContent = group.fact;
        const groupSet = new Set(group.ids);
        const slots = group.ids.length >= 5 ? fanSlots.many : fanSlots[group.ids.length];
        group.ids.forEach((id,index) => {
          const button = itemButtons.get(id);
          button.classList.remove("is-hidden");
          button.classList.add("is-active");
          setPosition(button,slots[Math.min(index,slots.length-1)]);
        });
        let hiddenIndex = 0;
        items.forEach((item) => {
          if (groupSet.has(item.id)) return;
          const button = itemButtons.get(item.id);
          button.classList.remove("is-active");
          button.classList.add("is-hidden");
          setPosition(button,hiddenSlots[hiddenIndex % hiddenSlots.length]);
          hiddenIndex += 1;
        });
        itemButtons.forEach((button,id) => button.classList.toggle("is-selected",id === selectedId));
      }
      function renderDock() {
        const item = byId.get(selectedId);
        dockThumb.replaceChildren();
        if (item.cover) {
          const image = document.createElement("img");
          image.src = item.cover;
          image.alt = "";
          dockThumb.append(image);
        } else {
          const fallback = document.createElement("span");
          fallback.textContent = item.short;
          dockThumb.append(fallback);
        }
        dockTitle.textContent = item.title;
        dockMeta.textContent = "小红书 · " + item.date + " · " + item.sharer;
        dockContext.textContent = item.context[mode];
        openLink.href = item.url;
      }
      function render() {
        modeButtons.forEach((button) => button.setAttribute("aria-pressed",String(button.dataset.mode === mode)));
        renderStrip();
        renderDeck();
        renderDock();
        const activeStripButton = strip.querySelector('button[aria-pressed="true"]');
        requestAnimationFrame(() => activeStripButton?.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"}));
      }
      function selectItem(id) {
        selectedId = id;
        if (hintShown) { firstHint.classList.add("is-gone"); hintShown = false; }
        itemButtons.forEach((button,itemId) => button.classList.toggle("is-selected",itemId === id));
        renderDock();
      }
      modeButtons.forEach((button) => {
        button.addEventListener("click",() => {
          const nextMode = button.dataset.mode;
          const containing = groupContaining(selectedId,nextMode);
          mode = nextMode;
          if (containing >= 0) activeIndex[mode] = containing;
          render();
        });
      });
      let settleTimer = null;
      strip.addEventListener("scroll",() => {
        window.clearTimeout(settleTimer);
        settleTimer = window.setTimeout(() => {
          const center = strip.getBoundingClientRect().left + strip.clientWidth / 2;
          const candidates = Array.from(strip.querySelectorAll("button"));
          let nearest = candidates[0];
          let distance = Infinity;
          candidates.forEach((button) => {
            const rect = button.getBoundingClientRect();
            const delta = Math.abs(rect.left + rect.width / 2 - center);
            if (delta < distance) { distance = delta; nearest = button; }
          });
          const index = Number(nearest.dataset.groupIndex);
          if (index !== activeIndex[mode]) {
            activeIndex[mode] = index;
            render();
          }
        },120);
      });
      render();
    })();
  </script>
</div>
</body>
</html>
