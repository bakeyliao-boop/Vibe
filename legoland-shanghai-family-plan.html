  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;legoland-dayplan&quot;&gt;
  &lt;style&gt;
    #legoland-dayplan { color: var(--foreground); }
    #legoland-dayplan * { box-sizing: border-box; }
    #legoland-dayplan .hero { display: grid; gap: 12px; }
    #legoland-dayplan .hero-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    #legoland-dayplan .section { margin-block: 24px; }
    #legoland-dayplan .section &gt; h2 { margin-bottom: 10px; }
    #legoland-dayplan .section &gt; h3 { margin-top: 18px; margin-bottom: 8px; }
    #legoland-dayplan .decision { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    #legoland-dayplan .decision-control { max-width: 760px; margin-top: 12px; }
    #legoland-dayplan .map-wrap { position: relative; width: 100%; aspect-ratio: 1200 / 668; overflow: hidden; background: var(--muted); }
    #legoland-dayplan .map-wrap &gt; img { display: block; width: 100%; height: 100%; object-fit: cover; }
    #legoland-dayplan .map-route { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #legoland-dayplan .map-route polyline { fill: none; stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
    #legoland-dayplan .map-route .route-morning { stroke: var(--viz-series-1); }
    #legoland-dayplan .map-route .route-transfer { stroke: var(--viz-series-2); stroke-dasharray: 5 4; }
    #legoland-dayplan .map-route .route-afternoon { stroke: var(--viz-series-3); }
    #legoland-dayplan .map-marker { position: absolute; translate: -50% -50%; width: 28px; height: 28px; border: 2px solid var(--primary-foreground); border-radius: 50%; background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; font-weight: 500; cursor: pointer; padding: 0; }
    #legoland-dayplan .map-marker[aria-pressed=&quot;true&quot;] { outline: 3px solid var(--ring); outline-offset: 2px; }
    #legoland-dayplan .map-detail { margin-top: 10px; }
    #legoland-dayplan .map-detail p { margin-bottom: 0; }
    #legoland-dayplan .map-caption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-top: 8px; }
    #legoland-dayplan .route-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; }
    #legoland-dayplan .route-swatch { display: inline-block; width: 20px; height: 3px; margin-right: 6px; vertical-align: middle; }
    #legoland-dayplan .route-swatch.morning { background: var(--viz-series-1); }
    #legoland-dayplan .route-swatch.transfer { background: var(--viz-series-2); }
    #legoland-dayplan .route-swatch.afternoon { background: var(--viz-series-3); }
    #legoland-dayplan .timeline { position: relative; margin-top: 12px; }
    #legoland-dayplan .timeline-item { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    #legoland-dayplan .timeline-item:last-child { border-bottom: 0; }
    #legoland-dayplan .timeline-time { font-variant-numeric: tabular-nums; font-weight: 500; }
    #legoland-dayplan .timeline-copy { display: grid; gap: 4px; }
    #legoland-dayplan .timeline-title { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 500; }
    #legoland-dayplan .queue-rule { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
    #legoland-dayplan .queue-rule &gt; div { padding: 10px; background: var(--muted); color: var(--muted-foreground); }
    #legoland-dayplan .queue-rule strong { display: block; color: var(--foreground); }
    #legoland-dayplan .parking-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    #legoland-dayplan .parking-map { width: 100%; height: auto; display: block; margin-top: 12px; }
    #legoland-dayplan .priority-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    #legoland-dayplan .priority-list { margin: 8px 0 0; padding-left: 20px; }
    #legoland-dayplan .priority-list li + li { margin-top: 6px; }
    #legoland-dayplan .spot-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; padding-left: 20px; }
    #legoland-dayplan .gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    #legoland-dayplan figure { margin: 0; }
    #legoland-dayplan figure img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
    #legoland-dayplan figcaption { display: grid; gap: 2px; margin-top: 6px; }
    #legoland-dayplan a { color: var(--primary); }
    #legoland-dayplan .source-list { display: grid; gap: 6px; }
    #legoland-dayplan .hidden { display: none; }
    @media (max-width: 620px) {
      #legoland-dayplan .decision,
      #legoland-dayplan .parking-grid,
      #legoland-dayplan .priority-grid,
      #legoland-dayplan .gallery { grid-template-columns: 1fr; }
      #legoland-dayplan .queue-rule { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #legoland-dayplan .timeline-item { grid-template-columns: 78px minmax(0, 1fr); gap: 8px; }
      #legoland-dayplan .spot-list { grid-template-columns: 1fr; }
      #legoland-dayplan .map-marker { width: 24px; height: 24px; }
    }
